name: Build and Upload Docker Image

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull nginx
        run: docker pull nginx:latest

      - name: Save to tar
        run: docker save nginx:latest -o nginx.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: nginx.tar
